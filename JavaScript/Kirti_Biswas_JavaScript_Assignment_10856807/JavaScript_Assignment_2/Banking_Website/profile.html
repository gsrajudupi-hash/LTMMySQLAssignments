<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Profile - SmartBank</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>
<body>
<header>
    

    <div class="logo">
        SmartBank
    </div>

    <nav>
        <a href="dashboard.html">Dashboard</a>
        <a href="accounts.html">Accounts</a>
        <a href="transactions.html">Transactions</a>
        <a href="loan.html">Loan</a>
        <a href="profile.html">Profile</a>
    </nav>

</header>

<section class="profile-section">

    <form id="profileForm"
          class="profile-card">

        <h2>Customer Profile</h2>

        <label>First Name</label>
        <input type="text"
               id="firstName">

        <label>Last Name</label>
        <input type="text"
               id="lastName">

        <label>Email</label>
        <input type="email"
               id="email">

        <label>Mobile Number</label>
        <input type="text"
               id="mobile">

        <label>Address</label>
        <textarea id="address"></textarea>

        <label>City</label>
        <input type="text"
               id="city">

        <label>State</label>
        <input type="text"
               id="state">

        <label>PIN Code</label>
        <input type="text"
               id="pinCode">

        <button type="submit">
            Update Profile
        </button>

    </form>

</section>

    <script src="js/profile.js"></script>

</body>
</html>s
