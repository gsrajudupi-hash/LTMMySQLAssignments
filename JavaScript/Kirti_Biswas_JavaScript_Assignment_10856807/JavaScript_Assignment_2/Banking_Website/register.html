<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register - SmartBank</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <div class="logo">
        SmartBank
    </div>

    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
    </nav>
</header>

<section class="register-container">

    <form id="registerForm" class="register-card">

        <h2>Customer Registration</h2>

        <div id="message"></div>

        <label>Customer ID</label>
        <input type="text"
               id="customerId"
               required>

        <label>First Name</label>
        <input type="text"
               id="firstName"
               required>

        <label>Last Name</label>
        <input type="text"
               id="lastName"
               required>

        <label>Email</label>
        <input type="email"
               id="email"
               required>

        <label>Mobile Number</label>
        <input type="text"
               id="mobile"
               required>

        <label>Account Type</label>
        <select id="accountType">
            <option>Savings</option>
            <option>Current</option>
        </select>

        <label>Initial Deposit</label>
        <input type="number"
               id="deposit"
               required>

        <label>Username</label>
        <input type="text"
               id="username"
               required>

        <label>Password</label>
        <input type="password"
               id="password"
               required>

        <label>Confirm Password</label>
        <input type="password"
               id="confirmPassword"
               required>

        <button type="submit">
            Register
        </button>

    </form>

</section>

    <script src="js/auth.js"></script>

</body>
</html>
