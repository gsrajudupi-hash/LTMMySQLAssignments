<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Transactions - SmartBank</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header>
    <div class="logo">
        SmartBank
    </div>

    <nav>
        <a href="dashboard.html">
            Dashboard
        </a>

        <a href="accounts.html">
            Accounts
        </a>

        <a href="transfer.html">
            Transfer
        </a>

        <a href="transactions.html">
            Transactions
        </a>

        <button id="logoutBtn"
                class="logout-btn">
            Logout
        </button>
    </nav>
</header>

<main class="transactions-section">

    <h2>Transaction History</h2>

    <!-- Transaction summary -->

    <section class="transaction-summary">

        <div class="summary-card credit-summary">
            <h3>Total Credits</h3>
            <p id="totalCredits">₹0</p>
        </div>

        <div class="summary-card debit-summary">
            <h3>Total Debits</h3>
            <p id="totalDebits">₹0</p>
        </div>

        <div class="summary-card transfer-summary">
            <h3>Total Transfers</h3>
            <p id="totalTransfers">₹0</p>
        </div>

        <div class="summary-card average-summary">
            <h3>Average Transaction</h3>
            <p id="averageTransaction">₹0</p>
        </div>

    </section>

    <!-- Search and filters -->

    <section class="transaction-controls">

        <input type="text"
               id="searchTransaction"
               placeholder="Search transaction ID">

        <select id="typeFilter">

            <option value="All">
                All Transactions
            </option>

            <option value="Credit">
                Credit
            </option>

            <option value="Debit">
                Debit
            </option>

            <option value="Transfer">
                Transfer
            </option>

        </select>

        <input type="date"
               id="dateFilter">

        <select id="sortTransaction">

            <option value="newest">
                Newest
            </option>

            <option value="oldest">
                Oldest
            </option>

            <option value="highest">
                Highest Amount
            </option>

            <option value="lowest">
                Lowest Amount
            </option>

        </select>

        <button type="button"
                id="clearFilterBtn">
            Clear Filters
        </button>

    </section>

    <!-- Message -->

    <p id="transactionMessage"></p>

    <!-- Transaction table -->

    <div class="transaction-table-container">

        <table class="transaction-table">

            <thead>
            <tr>
                <th>Date</th>
                <th>Transaction ID</th>
                <th>Type</th>
                <th>Description</th>
                <th>Amount</th>
                <th>Balance</th>
            </tr>
            </thead>

            <tbody id="transactionTableBody">

            </tbody>

        </table>

    </div>

</main>

    <script src="js/transactions.js"></script>

</body>
</html>
