<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Gallery</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        margin: 0;
        padding: 30px;
      }

      h2 {
        text-align: center;
        color: #333;
      }

      .preview-container {
        text-align: center;
        margin-bottom: 30px;
      }

      #preview {
        width: 700px;
        max-width: 100%;
        height: 400px;
        object-fit: cover;
        border-radius: 15px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
      }

      #imageTitle {
        margin-top: 15px;
        color: #2563eb;
      }

      .gallery {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 20px;
      }

      .gallery-item {
        background: white;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 3px 15px rgba(0, 0, 0, 0.1);
        transition: 0.3s;
      }

      .gallery-item:hover {
        transform: translateY(-5px);
      }

      .gallery-item img {
        width: 100%;
        height: 180px;
        object-fit: cover;
        cursor: pointer;
        transition: 0.3s;
      }

      .gallery-item img:hover {
        transform: scale(1.08);
      }

      .title {
        padding: 12px;
        text-align: center;
        font-weight: bold;
        color: #444;
      }
    </style>
  </head>
  <body>
    <h2>Image Gallery</h2>

    <div class="preview-container">
      <img
        id="preview"
        src="https://picsum.photos/id/1015/600/350"
        alt="Nature"
        class="gallery"
      />

      <div class="gallery-item">
        <img
          src="https://picsum.photos/id/1015/300/200"
          alt="Nature"
          onmouseover="showTitle(this)"
          onmouseleave="hideTitle(this)"
          onclick="showPreview(this)"
        />
        <div class="title">Nature</div>
      </div>

      <div class="gallery-item">
        <img
          src="https://picsum.photos/id/1040/300/200"
          alt="Mountains"
          onmouseover="showTitle(this)"
          onmouseleave="hideTitle(this)"
          onclick="showPreview(this)"
        />
        <div class="title">Mountains</div>
      </div>

      <div class="gallery-item">
        <img
          src="https://picsum.photos/id/1069/300/200"
          alt="Beach"
          onmouseover="showTitle(this)"
          onmouseleave="hideTitle(this)"
          onclick="showPreview(this)"
        />
        <div class="title">Beach</div>
      </div>

      <div class="gallery-item">
        <img
          src="https://picsum.photos/id/1074/300/200"
          alt="Forest"
          onmouseover="showTitle(this)"
          onmouseleave="hideTitle(this)"
          onclick="showPreview(this)"
        />
        <div class="title">Forest</div>
      </div>
    </div>

    <script>
      function showTitle(image) {
        image.nextElementSibling.style.visibility = "visible";
      }

      function hideTitle(image) {
        image.nextElementSibling.style.visibility = "hidden";
      }

      function showPreview(image) {
        document.getElementById("preview").src = image.src;

        document.getElementById("imageTitle").innerText = image.alt;
      }
    </script>
  </body>
</html>
