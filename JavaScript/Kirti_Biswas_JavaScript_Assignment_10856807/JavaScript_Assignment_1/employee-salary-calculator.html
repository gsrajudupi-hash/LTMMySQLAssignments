<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Employee Salary Calculator</title>

<style>

*{
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    padding:30px;
}

.container{
    max-width:700px;
    margin:auto;
    background:white;
    padding:25px;
    border-radius:12px;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
}

h2{
    text-align:center;
    color:#2563eb;
}

label{
    display:block;
    margin-top:15px;
    font-weight:bold;
}

input{
    width:100%;
    padding:10px;
    margin-top:5px;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    border:none;
    border-radius:6px;
    background:#2563eb;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#1d4ed8;
}

#salarySlip{
    margin-top:25px;
    display:none;
    background:#f8fafc;
    padding:20px;
    border-radius:10px;
    border-left:5px solid #2563eb;
}

.row{
    display:flex;
    justify-content:space-between;
    margin:8px 0;
}

.total{
    font-weight:bold;
    color:green;
    font-size:18px;
}

</style>
</head>

<body>

<div class="container">

<h2>Employee Salary Calculator</h2>

<label>Employee Name</label>
<input type="text" id="employeeName">

<label>Basic Salary</label>
<input type="number" id="basicSalary">

<button onclick="calculateSalary()">
Calculate Salary
</button>

<div id="salarySlip"></div>

</div>

<script>

function calculateSalary(){

    let employeeName =
        document.getElementById("employeeName")
        .value.trim();

    let basicSalary =
        parseFloat(
            document.getElementById("basicSalary")
            .value
        );

    if(employeeName === "" || isNaN(basicSalary)){

        alert("Please enter valid details");
        return;
    }

    let hra = basicSalary * 0.20;

    let da = basicSalary * 0.15;

    let pf = basicSalary * 0.12;

    let professionalTax = 200;

    let grossSalary =
        basicSalary + hra + da;

    let totalDeductions =
        pf + professionalTax;

    let netSalary =
        grossSalary - totalDeductions;

    let slip =
    `
    <h3>Salary Slip</h3>

    <div class="row">
        <span>Employee Name</span>
        <span>${employeeName}</span>
    </div>

    <hr>

    <div class="row">
        <span>Basic Salary</span>
        <span>₹${basicSalary.toFixed(2)}</span>
    </div>

    <div class="row">
        <span>HRA (20%)</span>
        <span>₹${hra.toFixed(2)}</span>
    </div>

    <div class="row">
        <span>DA (15%)</span>
        <span>₹${da.toFixed(2)}</span>
    </div>

    <div class="row">
        <span>PF (12%)</span>
        <span>₹${pf.toFixed(2)}</span>
    </div>

    <div class="row">
        <span>Professional Tax</span>
        <span>₹${professionalTax.toFixed(2)}</span>
    </div>

    <hr>

    <div class="row">
        <span>Gross Salary</span>
        <span>₹${grossSalary.toFixed(2)}</span>
    </div>

    <div class="row">
        <span>Total Deductions</span>
        <span>₹${totalDeductions.toFixed(2)}</span>
    </div>

    <hr>

    <div class="row total">
        <span>Net Salary</span>
        <span>₹${netSalary.toFixed(2)}</span>
    </div>
    `;

    let salarySlip =
        document.getElementById("salarySlip");

    salarySlip.style.display = "block";

    salarySlip.innerHTML = slip;
}

</script>

</body>
</html>
