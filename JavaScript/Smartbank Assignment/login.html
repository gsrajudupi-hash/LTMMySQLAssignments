<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login | SmartBank</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body data-page="login">
    <header id="site-header" class="site-header"></header>
    <main class="container">
        <form id="login-form" class="card narrow" novalidate>
            <h2>Login</h2>
            <label>Username<input name="username" autocomplete="username"><small class="err"></small></label>
            <label>Password<input name="password" type="password" autocomplete="current-password"><small
                    class="err"></small></label>
            <label class="inline"><input type="checkbox" id="show-pass"> Show password</label><br><button
                type="submit">Login</button>
            <p class="muted">Demo: srikanth / Nani@1234 · No account? <a href="register.html">Register</a></p>
        </form>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="js/app.js"></script>
</body>

</html>
