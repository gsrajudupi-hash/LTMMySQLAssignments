<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loan Calculator | SmartBank</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body data-page="loan">
    <header id="site-header" class="site-header"></header>
    <main class="container">
        <h1>Loan Calculator</h1>
        <form id="loan-form" class="card narrow" novalidate>
            <label>Loan Type<select name="loanType">
                    <option value="Personal">Personal Loan</option>
                    <option value="Home">Home Loan</option>
                    <option value="Car">Car Loan</option>
                    <option value="Education">Education Loan</option>
                </select></label>
            <label>Loan Amount (₹)<input name="amount" type="number" min="1" value="500000"></label>
            <label>Interest Rate (% per year)<input name="rate" type="number" step="0.01"></label>
            <label>Tenure (years)<input name="years" type="number" min="1" max="30" value="5"></label>
            <button type="submit">Calculate EMI</button>
        </form>
        <div id="result"></div>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="js/app.js"></script>
</body>

</html>
