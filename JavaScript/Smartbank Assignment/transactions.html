<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Transactions | SmartBank</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body data-page="transactions">
    <header id="site-header" class="site-header"></header>
    <main class="container">
        <h1>Transaction History</h1>
        <form id="filters" class="card filters">
            <label>Transaction ID<input name="q" placeholder="Search ID"></label>
            <label>Type<select name="type">
                    <option value="">All</option>
                    <option>Credit</option>
                    <option>Debit</option>
                </select></label>
            <label>Min amount<input name="min" type="number" min="0"></label><label>Max amount<input name="max"
                    type="number" min="0"></label>
            <label>From date<input name="from" type="date"></label><label>To date<input name="to" type="date"></label>
            <label>Sort by<select name="sort">
                    <option value="newest">Newest</option>
                    <option value="oldest">Oldest</option>
                    <option value="high">Highest amount</option>
                    <option value="low">Lowest amount</option>
                </select></label>
            <label><button type="reset" class="ghost">Reset</button></label>
        </form>
        <div id="stats" class="stats"></div>
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Transaction ID</th>
                        <th>Type</th>
                        <th>Description</th>
                        <th>Amount</th>
                        <th>Balance</th>
                    </tr>
                </thead>
                <tbody id="tx-body"></tbody>
            </table>
        </div>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="js/app.js"></script>
</body>

</html>
