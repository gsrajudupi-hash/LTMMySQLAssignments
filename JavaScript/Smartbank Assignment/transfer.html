<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fund Transfer | SmartBank</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body data-page="transfer">
    <header id="site-header" class="site-header"></header>
    <main class="container">
        <h1>Fund Transfer</h1>
        <form id="transfer-form" class="card narrow" novalidate>
            <label>From Account<select name="from"></select><small class="err"></small></label>
            <label>Beneficiary Account<input name="beneficiary" list="bene-list" placeholder="SB100002"><small
                    class="err"></small></label><datalist id="bene-list"></datalist>
            <label>Beneficiary Name<input name="beneficiaryName"><small class="err"></small></label>
            <label>Amount (₹)<input name="amount" type="number" step="0.01"><small class="err"></small></label>
            <label>Transfer Type<select name="type">
                    <option>IMPS</option>
                    <option>NEFT</option>
                    <option>RTGS</option>
                </select></label>
            <label>Remarks<input name="remarks"></label><button type="submit">Continue</button>
            <p class="muted">Limits — IMPS: up to ₹2,00,000 · NEFT: up to ₹10,00,000 · RTGS: ₹2,00,000 to ₹50,00,000</p>
        </form>
        <section id="confirm" class="card narrow" hidden>
            <h2>Confirm transfer</h2>
            <div id="summary"></div>
            <button id="confirm-btn">Confirm</button> <button id="cancel-btn" class="ghost">Cancel</button>
        </section>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="js/app.js"></script>
</body>

</html>
