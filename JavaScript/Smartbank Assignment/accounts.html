<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accounts | SmartBank</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body data-page="accounts">
    <header id="site-header" class="site-header"></header>
    <main class="container">
        <h1>My Accounts</h1><button id="toggle-bal" class="ghost">Hide balances</button><br><br>
        <div id="acc-list" class="grid"></div>
        <div class="grid">
            <form id="deposit-form" class="card" novalidate>
                <h2>Deposit</h2>
                <label>Account Number<select name="accountNumber"></select></label>
                <label>Amount (₹)<input name="amount" type="number" step="0.01"><small class="err"></small></label>
                <label>Deposit Type<select name="depositType">
                        <option>Cash</option>
                        <option>Cheque</option>
                        <option>UPI</option>
                    </select></label>
                <label>Description<input name="description"></label><button type="submit">Deposit</button>
            </form>
            <form id="withdraw-form" class="card" novalidate>
                <h2>Withdraw</h2>
                <label>Account Number<select name="accountNumber"></select></label>
                <label>Amount (₹)<input name="amount" type="number" step="0.01"><small class="err"></small></label>
                <label>Description<input name="description"></label><button type="submit">Withdraw</button>
            </form>
        </div>
    </main>
    <footer id="site-footer"></footer>
    <script type="module" src="js/app.js"></script>
</body>

</html>
