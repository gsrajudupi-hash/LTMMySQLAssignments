<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBank - Profile</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">SmartBank</div>
        <nav><a href="dashboard.html">Dashboard</a></nav>
    </header>
    <main class="form-container">
        <h2>Customer Profile</h2>
        <form id="profile-form">
            <input type="text" id="prof-name" placeholder="Full Name" required>
            <input type="email" id="prof-email" placeholder="Email" required>
            <input type="text" id="prof-mobile" placeholder="Mobile" required>
            <button type="submit">Update Profile</button>
        </form>
    </main>
</body>
</html>
