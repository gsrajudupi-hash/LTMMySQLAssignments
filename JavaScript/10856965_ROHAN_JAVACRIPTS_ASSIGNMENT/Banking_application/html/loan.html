<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartBank - Loan Calculator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <div class="logo">SmartBank</div>
        <nav><a href="dashboard.html">Dashboard</a></nav>
    </header>
    <main class="form-container">
        <h2>Loan Calculator</h2>
        <form id="loan-form">
            <input type="number" id="loan-amount" placeholder="Principal Amount" required>
            <input type="number" step="0.1" id="interest-rate" placeholder="Annual Interest Rate (%)" required>
            <input type="number" id="tenure" placeholder="Tenure (Months)" required>
            <button type="submit">Calculate EMI</button>
        </form>
        <div id="loan-result"></div>
    </main>
</body>
</html>
