<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Product Price Calculator</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>
    <a class="back" href="../index.html">&larr; All modules</a>
    <div class="card">
        <h2>3. Product Price Calculator</h2>
        <label>Product Name</label><input type="text" id="pname">
        <label>Quantity</label><input type="number" id="qty" min="1">
        <label>Price (₹)</label><input type="number" id="price" min="0">
        <button id="calc">Calculate</button>
        <div class="err" id="err"></div>
        <table id="res" style="display:none">
            <tr>
                <td>Subtotal</td>
                <td id="sub"></td>
            </tr>
            <tr>
                <td>GST (18%)</td>
                <td id="gst"></td>
            </tr>
            <tr>
                <td>Discount</td>
                <td id="disc"></td>
            </tr>
            <tr>
                <th>Final Amount</th>
                <th id="fin"></th>
            </tr>
        </table>
    </div>
    <script type="text/javascript" src="../js/q3.js"></script>
</body>

</html>
