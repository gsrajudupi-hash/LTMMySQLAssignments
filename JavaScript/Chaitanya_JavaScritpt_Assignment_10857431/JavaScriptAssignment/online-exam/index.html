<!DOCTYPE html>
<html>
<head>
    <title>Online Exam</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
 
<div class="container">
 
    <h2>Online Exam</h2>
 
    <form id="examForm">
 
        <p>1. Which language is used for web page scripting?</p>
 
        <label>
            <input type="radio" name="q1" value="JavaScript">
            JavaScript
        </label>
 
        <label>
            <input type="radio" name="q1" value="Java">
            Java
        </label>
 
 
        <p>2. Which HTML tag is used for a paragraph?</p>
 
        <label>
            <input type="radio" name="q2" value="p">
            &lt;p&gt;
        </label>
 
        <label>
            <input type="radio" name="q2" value="div">
            &lt;div&gt;
        </label>
 
 
        <p>3. Which method selects an element by ID?</p>
 
        <label>
            <input type="radio" name="q3" value="getElementById">
            getElementById()
        </label>
 
        <label>
            <input type="radio" name="q3" value="query">
            query()
        </label>
 
 
        <p>4. Which symbol is used for a single-line comment in JavaScript?</p>
 
        <label>
            <input type="radio" name="q4" value="//">
            //
        </label>
 
        <label>
            <input type="radio" name="q4" value="#">
            #
        </label>
 
 
        <p>5. Which keyword declares a variable in JavaScript?</p>
 
        <label>
            <input type="radio" name="q5" value="let">
            let
        </label>
 
        <label>
            <input type="radio" name="q5" value="define">
            define
        </label>
 
        <button type="submit">Submit Exam</button>
 
    </form>
 
    <div id="result"></div>
 
</div>
 
<script src="script.js"></script>
 
</body>
</html>
