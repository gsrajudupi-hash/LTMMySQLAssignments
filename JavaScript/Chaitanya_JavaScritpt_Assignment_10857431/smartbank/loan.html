<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBank - Loan Calculator</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="form-page">
    <div class="form-card">
      <h1>Loan Calculator</h1>
      <form id="loan-form">
        <label>Loan Type<select id="loanType"><option>Personal Loan</option><option>Home Loan</option><option>Car Loan</option><option>Education Loan</option></select></label>
        <label>Loan Amount<input id="loanAmount" type="number" min="1" required></label>
        <label>Interest Rate (% per year)<input id="interestRate" type="number" step="0.01" min="0" required></label>
        <label>Loan Tenure (years)<input id="loanTenure" type="number" min="1" required></label>
        <button class="btn" type="submit">Calculate EMI</button>
      </form>
      <div id="loan-result" class="result-box"></div>
    </div>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
