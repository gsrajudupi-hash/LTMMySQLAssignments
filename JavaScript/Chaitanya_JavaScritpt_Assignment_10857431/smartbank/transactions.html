<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBank - Transactions</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <div class="page-title"><div><p class="eyebrow">HISTORY</p><h1>Transactions</h1></div></div>
    <section class="card filters">
      <input id="search" placeholder="Search transaction ID or description">
      <select id="typeFilter"><option value="">All Types</option><option>Credit</option><option>Debit</option></select>
      <input id="minAmount" type="number" min="0" placeholder="Min Amount">
      <input id="maxAmount" type="number" min="0" placeholder="Max Amount">
      <input id="dateFilter" type="date">
      <select id="sortFilter"><option value="newest">Newest</option><option value="oldest">Oldest</option><option value="highest">Highest Amount</option><option value="lowest">Lowest Amount</option></select>
    </section>
    <section id="metrics" class="stats-grid section"></section>
    <section class="card">
      <div class="table-wrap"><table><thead><tr><th>Date</th><th>Transaction ID</th><th>Type</th><th>Description</th><th>Amount</th><th>Balance</th></tr></thead><tbody id="transaction-body"></tbody></table></div>
    </section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
