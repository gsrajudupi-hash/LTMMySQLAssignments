<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBank - Login</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="form-page">
    <div class="form-card">
      <h1>Login</h1>
      <div id="message"></div>
      <form id="login-form">
        <label>Username<input id="username" required></label>
        <label>Password<input id="password" type="password" required></label>
        <label class="check"><input id="show-password" type="checkbox"> Show password</label>
        <button class="btn" type="submit">Login</button>
      </form>
      <p class="muted">Demo: <b>demo</b> / <b>Demo@123</b></p>
      <p>New customer? <a href="register.html">Register</a></p>
    </div>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
