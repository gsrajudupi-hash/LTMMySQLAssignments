<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBank - Accounts</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="container">
    <div class="page-title"><div><p class="eyebrow">BANKING</p><h1>Accounts</h1></div><button id="toggle-balance" class="btn secondary">Hide Balances</button></div>
    <div id="message"></div>
    <section id="account-list" class="card-grid"></section>

    <section class="section two-col">
      <div class="card">
        <h2>Deposit</h2>
        <form id="deposit-form">
          <label>Account Number<input id="depositAccount" required></label>
          <label>Amount<input id="depositAmount" type="number" min="1" required></label>
          <label>Deposit Type<select id="depositType"><option>Cash</option><option>Online</option><option>Cheque</option></select></label>
          <label>Description<input id="depositDescription" required></label>
          <button class="btn" type="submit">Deposit</button>
        </form>
      </div>
      <div class="card">
        <h2>Withdrawal</h2>
        <form id="withdraw-form">
          <label>Account Number<input id="withdrawAccount" required></label>
          <label>Amount<input id="withdrawAmount" type="number" min="1" required></label>
          <label>Description<input id="withdrawDescription" required></label>
          <button class="btn" type="submit">Withdraw</button>
        </form>
      </div>
    </section>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
