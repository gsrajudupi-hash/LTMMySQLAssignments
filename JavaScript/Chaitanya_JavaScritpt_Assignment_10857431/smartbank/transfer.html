<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBank - Transfer</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="form-page">
    <div class="form-card">
      <h1>Fund Transfer</h1>
      <div id="message"></div>
      <form id="transfer-form">
        <label>From Account<input id="fromAccount" required></label>
        <label>Beneficiary Account<input id="beneficiaryAccount" required></label>
        <label>Beneficiary Name<input id="beneficiaryName" required></label>
        <label>Amount<input id="transferAmount" type="number" min="1" required></label>
        <label>Transfer Type<select id="transferType"><option>IMPS</option><option>NEFT</option><option>RTGS</option></select></label>
        <label>Remarks<input id="remarks"></label>
        <button class="btn" type="submit">Review Transfer</button>
      </form>
      <div id="confirmation" class="confirmation hidden"></div>
    </div>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
