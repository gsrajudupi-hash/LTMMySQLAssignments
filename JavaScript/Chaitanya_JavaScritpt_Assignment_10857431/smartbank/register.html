<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartBank - Register</title><link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main class="form-page">
    <div class="form-card wide">
      <h1>Customer Registration</h1>
      <div id="message"></div>
      <form id="register-form" class="form-grid">
        <label>Customer ID<input id="customerId" required></label>
        <label>First Name<input id="firstName" required></label>
        <label>Last Name<input id="lastName" required></label>
        <label>Date of Birth<input id="dob" type="date" required></label>
        <label>Gender<select id="gender" required><option value="">Select</option><option>Male</option><option>Female</option><option>Other</option></select></label>
        <label>Email<input id="email" type="email" required></label>
        <label>Mobile Number<input id="mobile" required></label>
        <label>Address<input id="address" required></label>
        <label>City<input id="city" required></label>
        <label>State<input id="state" required></label>
        <label>PIN Code<input id="pin" required></label>
        <label>Account Type<select id="accountType" required><option value="">Select</option><option>Savings</option><option>Current</option></select></label>
        <label>Initial Deposit<input id="initialDeposit" type="number" min="1000" required></label>
        <label>Username<input id="regUsername" required></label>
        <label>Password<input id="regPassword" type="password" required></label>
        <label>Confirm Password<input id="confirmPassword" type="password" required></label>
        <div class="full"><button class="btn" type="submit">Create Account</button></div>
      </form>
    </div>
  </main>
  <script type="module" src="js/app.js"></script>
</body>
</html>
