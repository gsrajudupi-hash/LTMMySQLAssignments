<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Online Voting System</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>4. Online Voting System</h1>
      <form id="voteForm">
        <label
          ><input
            class="inline"
            type="radio"
            name="candidate"
            value="Candidate A"
          />
          Candidate A</label
        ><label
          ><input
            class="inline"
            type="radio"
            name="candidate"
            value="Candidate B"
          />
          Candidate B</label
        ><label
          ><input
            class="inline"
            type="radio"
            name="candidate"
            value="Candidate C"
          />
          Candidate C</label
        ><button id="voteButton" type="submit">Vote</button>
      </form>
      <div id="voteResult" class="result">Select one candidate.</div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
