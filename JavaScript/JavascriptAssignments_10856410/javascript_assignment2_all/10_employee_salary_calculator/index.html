<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Employee Salary Calculator</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>10. Employee Salary Calculator</h1>
      <form id="salaryForm">
        <label>Employee Name<input id="salaryEmployeeName" required /></label
        ><label
          >Basic Salary<input
            id="basicSalary"
            type="number"
            min="0"
            step="0.01"
            required /></label
        ><button type="submit">Calculate Salary</button>
      </form>
      <div id="salarySlip" class="result salary-slip">
        Enter employee details.
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
