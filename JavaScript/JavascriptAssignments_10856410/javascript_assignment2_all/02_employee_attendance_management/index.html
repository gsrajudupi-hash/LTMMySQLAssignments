// Employee Attendance Management HTML Structure
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Employee Attendance Management</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>2. Employee Attendance Management</h1>
      <div class="row">
        <label>Employee ID<input id="employeeId" /></label
        ><label>Employee Name<input id="employeeName" /></label>
      </div>
      <div class="row">
        <button id="checkIn">Check In</button
        ><button id="checkOut">Check Out</button>
      </div>
      <div id="attendance" class="result">No attendance recorded.</div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
