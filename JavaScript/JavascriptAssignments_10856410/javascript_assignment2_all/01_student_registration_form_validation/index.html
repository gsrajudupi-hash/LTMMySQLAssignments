<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Student Registration Form Validation</title><link rel="stylesheet" href="style.css"></head><body><main class="container"><h1>1. Student Registration Form Validation</h1><form id="studentForm" novalidate>
<label>Name<input id="name" type="text"></label><div id="nameError" class="error"></div>
<label>Email<input id="email" type="email"></label><div id="emailError" class="error"></div>
<label>Mobile Number<input id="mobile" type="text" maxlength="10"></label><div id="mobileError" class="error"></div>
<label>Password<input id="password" type="password"></label><div id="passwordError" class="error"></div>
<label>Confirm Password<input id="confirmPassword" type="password"></label><div id="confirmError" class="error"></div>
<button type="submit">Register</button><p id="message"></p></form></main><script src="script.js"></script></body></html>
