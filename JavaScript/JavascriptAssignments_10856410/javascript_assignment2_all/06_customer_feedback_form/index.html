<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Customer Feedback Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>6. Customer Feedback Form</h1>
      <form id="feedbackForm">
        <div class="row">
          <label>Customer Name<input id="customerName" required /></label
          ><label
            >Email<input id="customerEmail" type="email" required
          /></label>
        </div>
        <label
          >Rating<select id="rating" required>
            <option value="">Select</option>
            <option>1</option>
            <option>2</option>
            <option>3</option>
            <option>4</option>
            <option>5</option>
          </select></label
        ><label
          >Suggestions<textarea id="suggestions" rows="4"></textarea></label
        ><label
          >Department<select id="department" required>
            <option value="">Select</option>
            <option>Sales</option>
            <option>Support</option>
            <option>Billing</option>
            <option>Technical</option>
          </select></label
        ><label
          ><input class="inline" id="subscribe" type="checkbox" />
          Subscribe</label
        ><button type="submit">Submit Feedback</button>
      </form>
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Rating</th>
            <th>Suggestions</th>
            <th>Department</th>
            <th>Subscribe</th>
          </tr>
        </thead>
        <tbody id="feedbackBody"></tbody>
      </table>
    </main>
    <script src="script.js"></script>
  </body>
</html>
